name: Generate Smart Index DB

on:
  # ריצה בכל שינוי בתוכן של תיקיות שבשורש המאגר (לא בקבצי שורש, לא ב-.github, ולא בקבצי GS)
  push:
    branches:
      - main
    paths:
      - '*/**'
      - '!.github/**'
      - '!**/*.gs'
      - '!**/*.GS'
  # דחיפה שנעשית ע"י GITHUB_TOKEN (חילוץ ה-ZIP) לא מפעילה workflows אחרים,
  # לכן מריצים גם בסיום workflow החילוץ
  workflow_run:
    workflows: ["Extract ZIP and Keep Empty Folders"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# מונע ריצות מקבילות שיתנגשו זו בזו
concurrency:
  group: generate-db
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Smart Index DB
        shell: python
        run: |
          import os
          import sqlite3
          import hashlib

          db_name = "repo_index.db"

          # קבצים שלא נכללים ב-DB: סיומת GS (לא תלוי באותיות) וקובצי README
          def is_ignored_file(name):
              lower = name.lower()
              return lower.endswith('.gs') or os.path.splitext(lower)[0] == 'readme'
          
          # במידה וקיים קובץ ישן - נמחק אותו כדי שיווצר מאפס מחדש
          if os.path.exists(db_name):
              os.remove(db_name)

          conn = sqlite3.connect(db_name)
          cursor = conn.cursor()

          # יצירת הטבלה לאינדקס - נשמור את סוג הפריט, נתיב, הורה, גודל, וחתימה (ללא התוכן)
          cursor.execute('''
              CREATE TABLE IF NOT EXISTS tree (
                  id INTEGER PRIMARY KEY AUTOINCREMENT,
                  type TEXT,
                  path TEXT,
                  name TEXT,
                  parent TEXT,
                  size INTEGER,
                  hash TEXT
              )
          ''')

          # פונקציה לייצור חתימה לקובץ (SHA256)
          def get_file_hash(filepath):
              hasher = hashlib.sha256()
              try:
                  with open(filepath, 'rb') as f:
                      # קריאה בחתיכות קטנות כדי למנוע צריכת זיכרון מוגזמת על קבצים כבדים
                      while chunk := f.read(8192):
                          hasher.update(chunk)
              except Exception:
                  return ""
              return hasher.hexdigest()

          # פונקציה רקורסיבית (מלמטה למעלה) - סורקת, מחשבת גדלים וחתימות לתיקיות
          def process_dir(current_path, parent_path=""):
              dir_size = 0
              dir_hasher = hashlib.sha256()
              
              try:
                  # חשוב: אנחנו ממיינים את התוכן כדי שהחתימה של התיקייה תהיה יציבה ותמיד תחושב באותו הסדר
                  entries = sorted(os.listdir(current_path))
              except PermissionError:
                  return 0, ""

              for entry in entries:
                  # התעלמות מתיקיות מיותרות ומקובץ ה-DB עצמו
                  if entry in ['.git', '.github'] or entry == db_name:
                      continue
                      
                  full_path = os.path.join(current_path, entry)
                  rel_path = os.path.relpath(full_path, '.') if current_path != '.' else entry
                  
                  # טיפול בקבצים
                  if os.path.isfile(full_path):
                      if is_ignored_file(entry):
                          continue
                      size = os.path.getsize(full_path)
                      f_hash = get_file_hash(full_path)
                      
                      cursor.execute('''
                          INSERT INTO tree (type, path, name, parent, size, hash)
                          VALUES (?, ?, ?, ?, ?, ?)
                      ''', ('file', rel_path, entry, parent_path, size, f_hash))
                      
                      dir_size += size
                      dir_hasher.update(f_hash.encode('utf-8'))
                      
                  # טיפול בתיקיות (קריאה לפונקציה מחדש על תתי התיקיות)
                  elif os.path.isdir(full_path):
                      sub_size, sub_hash = process_dir(full_path, rel_path)
                      
                      cursor.execute('''
                          INSERT INTO tree (type, path, name, parent, size, hash)
                          VALUES (?, ?, ?, ?, ?, ?)
                      ''', ('folder', rel_path, entry, parent_path, sub_size, sub_hash))
                      
                      dir_size += sub_size
                      dir_hasher.update(sub_hash.encode('utf-8'))
                      
              return dir_size, dir_hasher.hexdigest()

          # מתחילים את הסריקה מהשורש
          process_dir('.')

          conn.commit()
          conn.close()
          print(f"Index database {db_name} generated successfully with hashes!")

      - name: Create Release and Upload DB
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}-${{ github.run_attempt }}
          name: "Release v1.0.${{ github.run_number }}-${{ github.run_attempt }}"
          body: "אינדקס המאגר התעדכן אוטומטית. כולל חתימות, תיקיות וקבצים."
          files: repo_index.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
