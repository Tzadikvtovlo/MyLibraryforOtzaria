name: Generate Otzaria DB

# בונה DB אישי לאוצריא (SQLite) מכל קבצי ה-TXT שבתיקיות המאגר, ומעלה אותו ל-Release קבוע בשם latest.
# הקובץ תמיד באותה כתובת: Releases ← latest ← קובץ ה-DB.

on:
  # ריצה בכל שינוי בתוכן של תיקיות שבשורש המאגר (לא בקבצי שורש, לא ב-.github)
  push:
    branches:
      - main
    paths:
      - '*/**'
      - '!.github/**'
  # דחיפה שנעשית ע"י GITHUB_TOKEN (חילוץ ה-ZIP) לא מפעילה workflows אחרים,
  # לכן מריצים גם בסיום workflow החילוץ
  workflow_run:
    workflows: ["Extract ZIP and Keep Empty Folders"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

env:
  OFFICIAL_REPO: Otzaria/SeforimLibrary
  OFFICIAL_ASSET: seforim-schema6.db.zst

# מונע ריצות מקבילות שיתנגשו זו בזו
concurrency:
  group: generate-db
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install zstandard pynacl

      # ה-DB הרשמי של אוצריא נדרש ליצירת קישורים: הוא מתרגם "ספר + פרק/דף" לשורה המדויקת בספרייה הרשמית.
      # מורידים אותו בזמן הריצה (נשמר ב-cache לפי גרסה) כשיש במאגר ספרי TXT.
      - name: Check if the official DB is needed
        id: need-official
        run: |
          if [ -n "$(find . -mindepth 2 -not -path './.*' -iname '*.txt' ! -iname 'readme.txt' 2>/dev/null | head -n 1)" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=אין ספרים::לא נמצאו ספרי TXT בתיקיות, ולכן לא נוצר DB. מעלים ספרים והבנייה תרוץ שוב אוטומטית."
            echo "### לא נוצר DB: אין ספרים" >> "$GITHUB_STEP_SUMMARY"
            echo "לא נמצא אף קובץ TXT בתוך התיקיות. מעלו לפחות ספר אחד לתיקייה, והבנייה תרוץ שוב אוטומטית." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Find latest official DB release
        id: official
        if: steps.need-official.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG=$(gh api "repos/$OFFICIAL_REPO/releases?per_page=100" --jq             "[.[] | select(.draft==false and .prerelease==false and (.tag_name|test(\"^v[0-9]+-\")) and any(.assets[]; .name==\"$OFFICIAL_ASSET\"))] | sort_by(.published_at) | last | .tag_name")
          [ -n "$TAG" ] && [ "$TAG" != "null" ] || { echo "::error::לא נמצאה הוצאה רשמית עם $OFFICIAL_ASSET"; exit 1; }
          echo "ה-DB הרשמי: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Restore official DB cache
        id: official-cache
        if: steps.need-official.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/official/seforim-schema6.db.zst
          key: official-db-${{ steps.official.outputs.tag }}

      - name: Download official DB (cache miss)
        if: steps.need-official.outputs.needed == 'true' && steps.official-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/official"
          gh release download "${{ steps.official.outputs.tag }}" -R "$OFFICIAL_REPO" -p "$OFFICIAL_ASSET" -D "$RUNNER_TEMP/official" --clobber

      - name: Save official DB cache
        if: steps.need-official.outputs.needed == 'true' && steps.official-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/official/seforim-schema6.db.zst
          key: official-db-${{ steps.official.outputs.tag }}

      - name: Decompress official DB
        if: steps.need-official.outputs.needed == 'true'
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          zstd -q -d --long=31 -f "$RUNNER_TEMP/official/$OFFICIAL_ASSET" -o "$RUNNER_TEMP/official/seforim.db"
          rm -f "$RUNNER_TEMP/official/$OFFICIAL_ASSET"

      # יצירת קישורים אוטומטית (מנוע "מחולל הקישורים"): בבלי, ירושלמי, תנ"ך ועוד, לפי כותרות הספר.
      # ספרים שיש להם כבר קישורים משלכם (links.csv) לא נוגעים בהם. הקישורים לא נשמרים במאגר, רק ב-DB.
      - name: Generate links automatically
        if: steps.need-official.outputs.needed == 'true'
        run: python -X utf8 .github/scripts/auto_links.py . "$RUNNER_TEMP/official/seforim.db"

      # הגרסה הקודמת של ה-DB (מה-release latest): משמשת לשמירת מזהים יציבים בין בניות ולייצור קובץ עדכון קטן (דלתא).
      # בבנייה הראשונה, או אם הקובץ הקודם לא תקין, מדלגים: נבנה DB מלא בלבד.
      - name: Fetch previous DB (for small update files)
        id: prev
        if: steps.need-official.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          command -v zstd >/dev/null || sudo apt-get install -y zstd
          mkdir -p "$RUNNER_TEMP/prev"
          # מספר הגרסה = הגרסה הקודמת + 1 (או 1 אם אין גרסה קודמת). כך המספר לא תלוי במספר הריצות בגיטהאב.
          VERSION=1
          if gh release download latest -p "${REPO}.db" -D "$RUNNER_TEMP/prev" --clobber 2>/dev/null; then
            PREV_V=$(python -X utf8 -c 'import sqlite3,sys; m=dict(sqlite3.connect(sys.argv[1]).execute("select key,value from schema_meta").fetchall()); print(int(m["db_version"]) if m.get("library_id")==sys.argv[2] else "")' "$RUNNER_TEMP/prev/${REPO}.db" "$OWNER-$REPO" 2>/dev/null || true)
            if [ -n "$PREV_V" ]; then
              VERSION=$((PREV_V + 1))
              echo "path=$RUNNER_TEMP/prev/${REPO}.db" >> "$GITHUB_OUTPUT"
              echo "נמצאה גרסה קודמת ($PREV_V): ייווצר גם קובץ עדכון קטן"
            fi
          fi
          [ -n "${PREV_V:-}" ] || echo "אין גרסה קודמת תקינה: ייווצר DB מלא בלבד"
          echo "DB_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "גרסת ה-DB: $VERSION"

      - name: Build DB
        if: steps.need-official.outputs.needed == 'true'
        env:
          PREV_DB: ${{ steps.prev.outputs.path }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/work"
          # קבצי TXT בלבד מתוך תיקיות; README וקבצי GS (וכל קובץ שאינו TXT) לא נכללים
          OFFICIAL=()
          [ -f "$RUNNER_TEMP/official/seforim.db" ] && OFFICIAL=(--official "$RUNNER_TEMP/official/seforim.db")
          STABLE=()
          [ -n "${PREV_DB:-}" ] && STABLE=(--stable-from "$PREV_DB")
          python -X utf8 .github/scripts/build_personal_db.py . --root .             "${OFFICIAL[@]}" "${STABLE[@]}"             --out "$RUNNER_TEMP/work/raw.db"             --library-id "$OWNER-$REPO"             --source-name "$REPO"             --author "$OWNER"             --db-version "$DB_VERSION"             --display-name "הספרייה של $OWNER"
          python -X utf8 .github/scripts/compress_personal_db.py             "$RUNNER_TEMP/work/raw.db" "$RUNNER_TEMP/work/${REPO}.db"
          ls -l "$RUNNER_TEMP/work"

      # עדכונים אוטומטיים באוצריא: חותמים על מניפסט עדכון, והכתובת שלו נשמרת בתוך ה-DB עצמו.
      # מפתח החתימה נוצר פעם אחת ונשמר ב-release בשם db-key (או מגיע מסוד DB_SIGNING_KEY אם הגדרתם).
      # אסור למחוק את ה-release הזה: החלפת מפתח מחייבת כל משתמש לצרף את ה-DB מחדש.
      - name: Prepare signing key
        if: steps.need-official.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_SECRET: ${{ secrets.DB_SIGNING_KEY }}
        run: |
          set -euo pipefail
          KEY="$RUNNER_TEMP/signing.key"
          if [ -n "${SIGNING_SECRET:-}" ]; then
            echo "$SIGNING_SECRET" > "$KEY"
          elif gh release view db-key >/dev/null 2>&1; then
            gh release download db-key -p signing.key -D "$RUNNER_TEMP" --clobber
          else
            python -X utf8 .github/scripts/release_db.py keygen --out "$KEY"
            gh release create db-key --target "$GITHUB_SHA" --latest=false               --title "מפתח חתימה לעדכונים (אין למחוק)"               --notes "מפתח החתימה של עדכוני ה-DB. אין למחוק release זה, אחרת עדכונים אוטומטיים באוצריא יפסיקו לעבוד."
            gh release upload db-key "$KEY" --clobber
          fi

      - name: Add update info and pack
        if: steps.need-official.outputs.needed == 'true'
        env:
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PREV_DB: ${{ steps.prev.outputs.path }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/work"
          BASE="https://github.com/$GITHUB_REPOSITORY/releases/download"
          DELTA=()
          [ -n "${PREV_DB:-}" ] && DELTA=(--prev-dbs "$PREV_DB")
          python -X utf8 .github/scripts/release_db.py inject --db "$W/${REPO}.db"             --library-id "$OWNER-$REPO" --db-version "$DB_VERSION"             --manifest-url "$BASE/db/manifest.json" --key "$RUNNER_TEMP/signing.key"
          python -X utf8 .github/scripts/release_db.py pack --db "$W/${REPO}.db" --out "$W/out"             --url-prefix "$BASE/db-v$DB_VERSION"             --notes "עדכון אוטומטי, גרסה $DB_VERSION" "${DELTA[@]}"
          python -X utf8 .github/scripts/release_db.py sign "$W/out/manifest.json" --key "$RUNNER_TEMP/signing.key"
          PUB=$(python -X utf8 -c 'import sys; sys.path.insert(0, ".github/scripts"); import release_db; print(release_db.public_key_of(sys.argv[1]))' "$RUNNER_TEMP/signing.key")
          python -X utf8 .github/scripts/release_db.py verify "$W/out/manifest.json" --public-key "$PUB" --parts "$W/out" --db "$W/${REPO}.db" "${DELTA[@]}"
          ls -l "$W/out"

      - name: Publish releases
        if: steps.need-official.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          W="$RUNNER_TEMP/work"
          V="$DB_VERSION"
          NOW="$(date -u +'%Y-%m-%d %H:%M') UTC"

          # 1. קבצי הגרסה (לעדכון אוטומטי)
          gh release delete "db-v$V" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create "db-v$V" --target "$GITHUB_SHA" --latest=false             --title "גרסה $V (קבצי עדכון)" --notes "קבצים לעדכון אוטומטי של אוצריא. אין צורך להוריד מכאן."
          gh release upload "db-v$V" "$W"/out/* --clobber

          # 2. המניפסט הקבוע: אוצריא בודקת אותו כדי לדעת שיש גרסה חדשה (רק אחרי שהקבצים עלו)
          if ! gh release view db >/dev/null 2>&1; then
            gh release create db --target "$GITHUB_SHA" --latest=false               --title "מניפסט עדכון" --notes "אין צורך להוריד מכאן."
          fi
          gh release upload db "$W/out/manifest.json" "$W/out/manifest.json.sig" --clobber
          gh release edit db --notes "גרסה נוכחית: $V" --latest=false

          # 3. ההורדה הרגילה: release קבוע בשם latest, עם קובץ ה-DB
          NOTES="ה-DB נבנה אוטומטית מהספרים שבמאגר. עודכן לאחרונה: $NOW (גרסה $V)"
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "ה-DB העדכני" --notes "$NOTES" --latest
          else
            gh release create latest --title "ה-DB העדכני" --notes "$NOTES" --latest --target "$GITHUB_SHA"
          fi
          gh release upload latest "$W/${REPO}.db" --clobber

          # 4. ניקוי: משאירים 3 גרסאות אחרונות של קבצי עדכון
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep -E '^db-v[0-9]+$' | sort -t v -k2 -n -r | tail -n +4 | while read -r t; do
            gh release delete "$t" --yes --cleanup-tag || true
          done
